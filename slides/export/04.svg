<svg data-slide="04" class="dsvg" viewBox="0 0 1700 780" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="qud" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="mk d"/></marker><marker id="quds" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk d"/></marker><marker id="quc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="mk c"/></marker><marker id="qucs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk c"/></marker></defs><g class="bx ext" data-id="b15" data-n="Mô hình float" data-i="Mô hình huấn luyện ở dạng số thực trên máy tính (LeNet-5 98.83%, LSTM 97.58%)."><rect x="0" y="20" width="360" height="150" rx="3"/><text x="180" y="73.0" text-anchor="middle" class="t1" font-size="24.0">Mô hình float</text><text x="180" y="102.0" text-anchor="middle" class="t2" font-size="19.0">model/*.npz</text><text x="180" y="131.0" text-anchor="middle" class="t2" font-size="19.0">LeNet-5 · LSTM</text></g><g class="bx dp" data-id="b16" data-n="PTQ" data-i="Post-training quantization: scale = max|w|/127 cho từng tensor, không có zero-point; weight nằm trong [−127, 127]."><rect x="444" y="20" width="360" height="150" rx="3"/><text x="624" y="73.0" text-anchor="middle" class="t1" font-size="24.0">PTQ</text><text x="624" y="102.0" text-anchor="middle" class="t2" font-size="19.0">scripts/quantize.py</text><text x="624" y="131.0" text-anchor="middle" class="t2" font-size="19.0">đối xứng · per-tensor</text></g><g class="bx mem" data-id="b17" data-n="Tham số INT8" data-i="Header C do quantize.py sinh ra: weight/bias số nguyên, mult int16 và shift ≤ 31 cho từng lớp, ảnh thử và logits golden."><rect x="888" y="20" width="360" height="150" rx="3"/><text x="1068" y="73.0" text-anchor="middle" class="t1" font-size="24.0">Tham số INT8</text><text x="1068" y="102.0" text-anchor="middle" class="t2" font-size="19.0">fw/model_*.h</text><text x="1068" y="131.0" text-anchor="middle" class="t2" font-size="19.0">weight · bias · mult/shift</text></g><g class="bx ctl" data-id="b18" data-n="Golden số nguyên" data-i="Mô hình tham chiếu số nguyên làm tròn giống RTL (cộng nửa bước rồi dịch số học, rồi bão hòa). Log: mism(cpu/npu vs golden)=0/0."><rect x="1332" y="20" width="360" height="150" rx="3"/><text x="1512" y="73.0" text-anchor="middle" class="t1" font-size="24.0">Golden số nguyên</text><text x="1512" y="102.0" text-anchor="middle" class="t2" font-size="19.0">bit-exact</text><text x="1512" y="131.0" text-anchor="middle" class="t2" font-size="19.0">đối chiếu CPU và NPU</text></g><g class="aw" data-f="b15" data-t="b16"><path class="ar d" d="M360 95 L444 95" marker-end="url(#qud)"/></g><g class="aw" data-f="b16" data-t="b17"><path class="ar d" d="M804 95 L888 95" marker-end="url(#qud)"/></g><g class="aw" data-f="b17" data-t="b18"><path class="ar d" d="M1248 95 L1332 95" marker-end="url(#qud)"/></g><g class="bx dp" data-id="grid" data-n="Lưới INT8" data-i="Mỗi giá trị thực được làm tròn tới số nguyên gần nhất rồi bão hòa trong [−128, 127]; giá trị vượt quá bị cắt về 127."><rect class="hit" x="100" y="260" width="1380" height="260"/><line class="axis" x1="120" y1="470" x2="1400" y2="470"/><line class="tick" x1="120" y1="462" x2="120" y2="478"/><line class="tick" x1="160" y1="462" x2="160" y2="478"/><line class="tick" x1="200" y1="462" x2="200" y2="478"/><line class="tick" x1="240" y1="462" x2="240" y2="478"/><line class="tick" x1="280" y1="462" x2="280" y2="478"/><line class="tick" x1="320" y1="462" x2="320" y2="478"/><line class="tick" x1="360" y1="462" x2="360" y2="478"/><line class="tick" x1="400" y1="462" x2="400" y2="478"/><line class="tick" x1="440" y1="462" x2="440" y2="478"/><line class="tick" x1="480" y1="462" x2="480" y2="478"/><line class="