<svg data-slide="09" class="dsvg" viewBox="0 0 1700 780" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="pod" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="mk d"/></marker><marker id="pods" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk d"/></marker><marker id="poc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="mk c"/></marker><marker id="pocs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk c"/></marker></defs><g class="bx dp chain" data-id="b61" data-n="c_out[j]" data-i="Một cột j của hàng kết quả từ mảng; mỗi cột có đường hậu xử lý riêng." style="--d:0.00s"><rect x="0" y="290" width="200" height="130" rx="3"/><text x="100" y="333.0" text-anchor="middle" class="t1" font-size="24.0">c_out[j]</text><text x="100" y="362.0" text-anchor="middle" class="t2" font-size="19.0">INT32</text><text x="100" y="391.0" text-anchor="middle" class="t2" font-size="19.0">từ sa_top</text></g><g class="bx dp chain" data-id="b62" data-n="Cộng dồn" data-i="Nếu ACCUM = 1: cộng với giá trị CBUF cũ để ghép các K-chunk; ngược lại ghi đè." style="--d:0.70s"><rect x="240" y="290" width="200" height="130" rx="3"/><text x="340" y="333.0" text-anchor="middle" class="t1" font-size="24.0">Cộng dồn</text><text x="340" y="362.0" text-anchor="middle" class="t2" font-size="19.0">sum_row =</text><text x="340" y="391.0" text-anchor="middle" class="t2" font-size="19.0">CBUF cũ + c_out</text></g><g class="bx dp chain" data-id="b63" data-n="Cộng bias" data-i="Bias INT32 theo cột j, ghi ở 0x40 + 4j." style="--d:1.40s"><rect x="480" y="290" width="200" height="130" rx="3"/><text x="580" y="333.0" text-anchor="middle" class="t1" font-size="24.0">Cộng bias</text><text x="580" y="362.0" text-anchor="middle" class="t2" font-size="19.0">sum + bias[j]</text><text x="580" y="391.0" text-anchor="middle" class="t2" font-size="19.0">INT32</text></g><g class="bx dp chain" data-id="b64" data-n="Nhân" data-i="Nhân với QMULT (int16 có dấu); tích rộng 48 bit để không tràn." style="--d:2.10s"><rect x="720" y="290" width="200" height="130" rx="3"/><text x="820" y="333.0" text-anchor="middle" class="t1" font-size="24.0">Nhân</text><text x="820" y="362.0" text-anchor="middle" class="t2" font-size="19.0">× QMULT</text><text x="820" y="391.0" text-anchor="middle" class="t2" font-size="19.0">prod 48 bit</text></g><g class="bx dp chain" data-id="b65" data-n="Làm tròn + dịch" data-i="Cộng nửa bước rồi dịch phải số học QSHIFT (0..31): làm tròn tới số gần nhất." style="--d:2.80s"><rect x="960" y="290" width="200" height="130" rx="3"/><text x="1060" y="333.0" text-anchor="middle" class="t1" font-size="20.2">Làm tròn + dịch</text><text x="1060" y="362.0" text-anchor="middle" class="t2" font-size="19.0">+ 2^(QSHIFT−1)</text><text x="1060" y="391.0" text-anchor="middle" class="t2" font-size="19.0">>>> QSHIFT</text></g><g class="bx dp chain" data-id="b66" data-n="Bão hòa" data-i="Cắt về khoảng INT8: giá trị > 127 thành 127, &lt; −128 thành −128." style="--d:3.50s"><rect x="1200" y="290" width="200" height="130" rx="3"/><text x="1300" y="333.0" text-anchor="middle" class="t1" font-size="24.0">Bão hòa</text><text x="1300" y="362.0" text-anchor="middle" class="t2" font-size="19.0">clamp8</text><text x="1300" y="391.0" text-anchor="middle" class="t2" font-size="19.0">[−128, 127]</text></g><g class="bx dp chain" data-id="b67" data-n="ACT" data-i="Hàm kích hoạt: 0 không, 1 ReLU, 2 sigmoid LUT, 3 tanh LUT (bảng tra)." style="--d:4.20s"><rect x="1440" y="290" width="200" height="130" rx="3"/><text x="1540" y="333.0" text-anchor="middle" class="t1" font-size="24.0">ACT</text><text x="1540" y="362.0" text-anchor="middle" class="t2" font-size="19.0">none · ReLU</text><text x="1540" y="391.0" text-anchor="middle" class="t2" font-size="16.9">sigmoid · tanh LUT</text></g><g class="aw" data-f="b61" data-t="b62"><path class="ar d" d="M200 355 L240 355" marker-end="url(#pod)"/></g><g class="aw" data-f="b62" data-t="b63"><path class="ar d" d="M440 355 L480 355" marker-end="url(#pod)"/></g><g class="aw" data-f="b63" data-t="b64"><path class="ar d" d="M680 355 L720 355" marker-end="url(#pod)"/></g><g class="aw" data-f="b64" data-t="b65"><path class="ar d" d="M920 355 L960 355" marker-end="url(#pod)"/></g><g class="aw" data-f="b65" data-t="b66"><path class="ar d" d="M1160 355 L1200 355" marker-end="url(#pod)"/></g><g class="aw" data-f="b66" data-t="b67"><path class="ar d" d="M1400 355 L1440 355" marker-end="url(#pod)"/></g><g class="bx ctl" data-id="b68" data-n="CTRL.ACCUM" data-i="Bit ACCUM của CTRL: chọn cộng thêm CBUF cũ hay ghi đè."><rect x="200" y="60" width="280" height="90" rx="3"/><text x="340" y="97.5" text-anchor="middle" class="t1" font-size="24.0">CTRL.ACCUM</text><text x="340" y="126.5" text-anchor="middle" class="t2" font-size="19.0">cộng CBUF cũ nếu = 1</text></g><g class="aw" data-f="b68" data-t="b62"><path class="ar c" d="M340 150 L340 290" marker-end="url(#poc)"/></g><g class="bx mem" data-id="b69" data-n="bias[j]" data-i="Bias INT32 do CPU ghi."><rect x="500" y="60" width="160" height="90" rx="3"/><text x="580" y="97.5" text-anchor="middle" class="t1" font-size="24.0">bias[j]</text><text x="580" y="126.5" text-anchor="middle" class="t2" font-size="15.8">INT32 · 0x40+4j</text></g><g class="aw" data-f="b69" data-t="b63"><path class="ar c" d="M580 150 L580 290" marker-end="url(#poc)"/></g><g class="bx ctl" data-id="b70" data-n="QMULT" data-i="Hệ số nhân xấp xỉ real_multiplier ≈ QMULT / 2^QSHIFT, do quantize.py chọn cho từng lớp."><rect x="720" y="60" width="200" height="90" rx="3"/><text x="820" y="97.5" text-anchor="middle" class="t1" font-size="24.0">QMULT</text><text x="820" y="126.5" text-anchor="middle" class="t2" font-size="19.0">int16 có dấu</text></g><g class="aw" data-f="b70" data-t="b64"><path class="ar c" d="M820 150 L820 290" marker-end="url(#poc)"/></g><g class="bx ctl" data-id="b71" data-n="QSHIFT" data-i="Số bit dịch phải; shift lớn hơn cho độ chính xác cao hơn miễn là QMULT còn vừa int16."><rect x="960" y="60" width="200" height="90" rx="3"/><text x="1060" y="97.5" text-anchor="middle" class="t1" font-size="24.0">QSHIFT</text><text x="1060" y="126.5" text-anchor="middle" class="t2" font-size="19.0">0..31</text></g><g class="aw" data-f="b71" data-t="b65"><path class="ar c" d="M1060 150 L1060 290" marker-end="url(#poc)"/></g><g class="bx ctl" data-id="b72" data-n="ACT" data-i="Thanh ghi ACT chọn hàm kích hoạt."><rect x="1440" y="50" width="200" height="100" rx="3"/><text x="1540" y="78.0" text-anchor="middle" class="t1" font-size="24.0">ACT</text><text x="1540" y="107.0" text-anchor="middle" class="t2" font-size="19.0">0 none · 1 ReLU</text><text x="1540" y="136.0" text-anchor="middle" class="t2" font-size="16.9">2 sigmoid · 3 tanh</text></g><g class="aw" data-f="b72" data-t="b67"><path class="ar c" d="M1540 150 L1540 290" marker-end="url(#poc)"/></g><g class="bx mem" data-id="b73" data-n="CBUF" data-i="Tổng INT32 luôn được ghi vào CBUF."><rect x="240" y="560" width="200" height="90" rx="3"/><text x="340" y="597.5" text-anchor="middle" class="t1" font-size="24.0">CBUF</text><text x="340" y="626.5" text-anchor="middle" class="t2" font-size="15.2">INT32 (ghi mỗi hàng)</text></g><g class="aw" data-f="b62" data-t="b73"><path class="ar d" d="M340 420 L340 560" marker-end="url(#pod)"/></g><g class="bx mem" data-id="b74" data-n="QBUF" data-i="Kết quả INT8 cuối cùng, CPU đọc tại 0x1000."><rect x="1440" y="560" width="200" height="90" rx="3"/><text x="1540" y="597.5" text-anchor="middle" class="t1" font-size="24.0">QBUF</text><text x="1540" y="626.5" text-anchor="middle" class="t2" font-size="19.0">INT8 · CPU đọc</text></g><g class="aw" data-f="b67" data-t="b74"><path class="ar d" d="M1540 420 L1540 560" marker-end="url(#pod)"/></g><text x="470" y="470" class="cap" font-size="20" text-anchor="start">Nhánh QUANT = 1: chạy sau</text><text x="470" y="500" class="cap" font-size="20" text-anchor="start">khi hàng sum_row sẵn sàng</text><text x="840" y="470" class="cap" font-size="20" text-anchor="start">Khi QUANT = 0: chỉ ghi CBUF</text><text x="840" y="500" class="cap" font-size="20" text-anchor="start">(INT32), bỏ qua nhánh INT8</text><text x="0" y="466" class="cap" font-size="18" text-anchor="start">mỗi cột j: một đường</text><text x="0" y="492" class="cap" font-size="18" text-anchor="start">hậu xử lý song song</text><rect class="lg dp" x="0" y="752" width="26" height="16" rx="2"/><text x="36" y="766" class="cap" font-size="19">datapath</text><rect class="lg ctl" x="168.8" y="752" width="26" height="16" rx="2"/><text x="204.8" y="766" class="cap" font-size="19">điều khiển</text><rect class="lg mem" x="360.8" y="752" width="26" height="16" rx="2"/><text x="396.8" y="766" class="cap" font-size="19">bộ nhớ</text><rect class="lg ext" x="506.4" y="752" width="26" height="16" rx="2"/><text x="542.4" y="766" class="cap" font-size="19">ngoài khối</text></svg>