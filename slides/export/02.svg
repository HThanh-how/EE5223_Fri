<svg data-slide="02" class="dsvg" viewBox="0 0 1700 780" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="gmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="mk d"/></marker><marker id="gmds" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk d"/></marker><marker id="gmc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="mk c"/></marker><marker id="gmcs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk c"/></marker></defs><g class="bx ext" data-id="b1" data-n="LeNet-5 · CNN" data-i="CNN: lớp convolution được trải phẳng bằng im2col thành phép nhân ma trận; lớp fully-connected vốn là GEMM."><rect x="0" y="40" width="380" height="200" rx="3"/><text x="190" y="118.0" text-anchor="middle" class="t1" font-size="24.0">LeNet-5 · CNN</text><text x="190" y="147.0" text-anchor="middle" class="t2" font-size="19.0">convolution → im2col</text><text x="190" y="176.0" text-anchor="middle" class="t2" font-size="19.0">FC = GEMM sẵn có</text></g><g class="bx ext" data-id="b2" data-n="LSTM" data-i="LSTM: các phép nhân ma trận của bốn cổng được biểu diễn dưới dạng GEMM; phép cập nhật cell từng phần tử vẫn chạy trên CPU."><rect x="0" y="330" width="380" height="200" rx="3"/><text x="190" y="408.0" text-anchor="middle" class="t1" font-size="24.0">LSTM</text><text x="190" y="437.0" text-anchor="middle" class="t2" font-size="19.0">4 cổng i · f · g · o</text><text x="190" y="466.0" text-anchor="middle" class="t2" font-size="19.0">gộp thành GEMM</text></g><g class="aw" data-f="b1" data-t="gemm"><path class="ar d" d="M380 140 L540 140" marker-end="url(#gmd)"/></g><g class="aw" data-f="b2" data-t="gemm"><path class="ar d" d="M380 430 L540 430" marker-end="url(#gmd)"/></g><g cl