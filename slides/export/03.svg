<svg data-slide="03" class="dsvg" viewBox="0 0 1700 780" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="syd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="mk d"/></marker><marker id="syds" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk d"/></marker><marker id="syc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="mk c"/></marker><marker id="sycs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk c"/></marker></defs><rect class="frame" x="620" y="10" width="1080" height="720" rx="4"/><text x="638" y="42" class="fl" font-size="21">npu_avmm · wrapper Avalon-MM slave</text><g class="bx ext" data-id="b5" data-n="CPU RISC-V" data-i="CPU chạy firmware C: nạp weight và activation, cấu hình thanh ghi, bấm start, đọc kết quả. PicoRV32 trong mô phỏng, Nios V trên DE10-Nano; cùng giao diện Avalon-MM."><rect x="0" y="215" width="300" height="150" rx="3"/><text x="150" y="268.0" text-anchor="middle" class="t1" font-size="24.0">CPU RISC-V</text><text x="150" y="297.0" text-anchor="middle" class="t2" font-size="19.0">PicoRV32 (mô phỏng)</text><text x="150" y="326.0" text-anchor="middle" class="t2" font-size="19.0">Nios V (DE10-Nano)</text></g><g class="bx mem" data-id="b6" data-n="RAM" data-i="RAM chứa firmware, weight, ảnh và log của CPU."><rect x="0" y="500" width="300" height="120" rx="3"/><text x="150" y="538.0" text-anchor="middle" class="t1" font-size="24.0">RAM</text><text x="150" y="567.0" text-anchor="middle" class="t2" font-size="19.0">chương trình + dữ liệu</text><text x="150" y="596.0" text-anchor="middle" class="t2" font-size="19.0">firmware C</text></g><g class="aw" data-f="b5" data-t="b6"><path class="ar d" d="M150 365 L150 500" marker-end="url(#syd)" marker-start="url(#syds)"/></g><g class="aw" data-f="b5" data-t="b7"><path class="ar d" d="M300 290 L660 290" marker-end="url(#syd)" marker-start="url(#syds)"/></g><text x="480" y="268" class="cap" font-size="21" text-anchor="middle">Avalon-MM</text><text x="480" y="322" class="cap" font-size="19" text-anchor="middle">32 bit · 64 KiB</text><text x="480" y="350" class="cap" font-size="19" text-anchor="middle">readLatency 1</text><g class="bx ctl" data-id="b7" data-n="Giải mã" data-i="Hai bit avs_address[13:12] chọn vùng: thanh ghi/QBUF, WEIGHT, ABUF hoặc CBUF."><rect x="660" y="230" width="180" height="120" rx="3"/><text x="750" y="268.0" text-anchor="middle" class="t1" font-size="24.0">Giải mã</text><text x="750" y="297.0" text-anchor="middle" class="t2" font-size="19.0">địa chỉ</text><text x="750" y="326.0" text-anchor="middle" class="t2" font-size="19.0">avs_address</text></g><g class="bx ctl" data-id="b8" data-n="Thanh ghi + Sequencer" data-i="CTRL bắt đầu một lượt chạy; M là số hàng; QMULT, QSHIFT, ACT, BIAS[j] cấu hình requant. Sequencer đưa từng hàng ABUF vào mảng và nhận kết quả."><rect x="900" y="70" width="540" height="110" rx="3"/><text x="1170" y="103.0" text-anchor="middle" class="t1" font-size="24.0">Thanh ghi + Sequencer</text><text x="1170" y="132.0" text-anchor="middle" class="t2" font-size="19.0">CTRL · STATUS · M · CYCLES · INFO</text><text x="1170" y="161.0" text-anchor="middle" class="t2" font-size="19.0">QMULT · QSHIFT · ACT · BIAS[j]</text></g><g class="aw" data-f="b7" data-t="b8"><path class="ar c" d="M750 230 L750 125 L900 125" marker-end="url(#syc)"/></g><g class="bx mem" data-id="b9" data-n="ABUF" data-i="Bộ đệm activation INT8: CPU ghi từng hàng của ma trận A; sequencer đọc mỗi chu kỳ một hàng đưa vào sa_top."><rect x="900" y="250" width="200" height="90" rx="3"/><text x="1000" y="287.5" text-anchor="middle" class="t1" font-size="24.0">ABUF</text><text x="1000" y="316.5" text-anchor="middle" class="t2" font-size="19.0">INT8 · CPU ghi</text></g><g class="aw" data-f="b7" data-t="b9"><path class="ar d" d="M840 290 L900 290" marker-end="url(#syd)"/></g><g class="bx dp" data-id="b10" data-n="sa_top" data-i="Mảng systolic weight-stationary N×N kèm skew đầu vào và de-skew đầu ra; độ trễ từ in_valid đến out_valid là 2N − 1 chu kỳ."><rect x="1190" y="230" width="250" height="130" rx="3"/><text x="1315" y="258.5" text-anchor="middle" class="t1" font-size="24.0">sa_top</text><text x="1315" y="287.5" text-anchor="middle" class="t2" font-size="19.0">Systolic Array N×N</text><text x="1315" y="316.5" text-anchor="middle" class="t2" font-size="19.0">skew · de-skew</text><text x="1315" y="345.5" text-anchor="middle" class="t2" font-size="19.0">trễ 2N − 1</text></g><g class="aw" data-f="b9" data-t="b10"><path class="ar d" d="M1100 290 L1190 290" marker-end="url(#syd)"/></g><text x="1145" y="276" class="cap" font-size="17" text-anchor="middle">a_in</text><g class="aw" data-f="b7" data-t="b10"><path class="ar d" d="M750 350 L750 395 L1240 395 L1240 360" marker-end="url(#syd)"/></g><text x="900" y="385" class="cap" font-size="18" text-anchor="start">WEIGHT · CPU ghi khi !busy</text><g class="aw" data-f="b8" data-t="b10"><path class="ar c" d="M1315 180 L1315 230" marker-end="url(#syc)"/></g><text x="1330" y="212" class="cap" font-size="17" text-anchor="start">start · M</text><g class="bx dp" data-id="b11" data-n="Cộng dồn" data-i="sum_row = giá trị CBUF cũ (nếu ACCUM) + c_out; cho phép chia K lớn thành nhiều lượt."><rect x="1490" y="230" width="190" height="130" rx="3"/><text x="1585" y="273.0" text-anchor="middle" class="t1" font-size="24.0">Cộng dồn</text><text x="1585" y="302.0" text-anchor="middle" class="t2" font-size="19.0">K-chunk</text><text x="1585" y="331.0" text-anchor="middle" class="t2" font-size="19.0">sum_row</text></g><g class="aw" data-f="b10" data-t="b11"><path class="ar d" d="M1440 295 L1490 295" marker-end="url(#syd)"/></g><g class="bx mem" data-id="b12" data-n="CBUF" data-i="Bộ đệm tổng INT32: C[m][j] tại địa chỉ 0xC000 + 4·(m·N + j); CPU đọc được."><rect x="1500" y="470" width="180" height="90" rx="3"/><text x="1590" y="507.5" text-anchor="middle" class="t1" font-size="24.0">CBUF</text><text x="1590" y="536.5" text-anchor="middle" class="t2" font-size="19.0">INT32</text></g><g class="aw" data-f="b11" data-t="b12"><path class="ar d" d="M1640 360 L1640 470" marker-end="url(#syd)"/></g><g class="bx dp" data-id="b13" data-n="Hậu xử lý" data-i="Chạy khi CTRL.QUANT = 1: cộng bias, nhân QMULT int16, làm tròn và dịch QSHIFT, bão hòa INT8, rồi ReLU hoặc LUT sigmoid/tanh."><rect x="1190" y="470" width="250" height="120" rx="3"/><text x="1315" y="508.0" text-anchor="middle" class="t1" font-size="24.0">Hậu xử lý</text><text x="1315" y="537.0" text-anchor="middle" class="t2" font-size="19.0">(acc + bias) × QMULT</text><text x="1315" y="566.0" text-anchor="middle" class="t2" font-size="19.0">>>> QSHIFT · ACT</text></g><g class="aw" data-f="b11" data-t="b13"><path class="ar d" d="M1530 360 L1530 420 L1360 420 L1360 470" marker-end="url(#syd)"/></g><g class="bx mem" data-id="b14" data-n="QBUF" data-i="Bộ đệm kết quả INT8 sau hậu xử lý, đọc tại 0x1000."><rect x="900" y="470" width="200" height="90" rx="3"/><text x="1000" y="507.5" text-anchor="middle" class="t1" font-size="24.0">QBUF</text><text x="1000" y="536.5" text-anchor="middle" class="t2" font-size="19.0">INT8 · CPU đọc</text></g><g class="aw" data-f="b13" data-t="b14"><path class="ar d" d="M1190 530 L1100 530" marker-end="url(#syd)"/></g><g class="aw" data-f="b14" data-t="b7"><path class="ar r" d="M900 520 L700 520 L700 350" marker-end="url(#syd)"/></g><g class="aw" data-f="b12" data-t=""><path class="ar r" d="M1590 560 L1590 650 L700 650 L700 520" marker-end="url(#syd)"/></g><text x="960" y="640" class="cap" font-size="18" text-anchor="start">CPU đọc CBUF / QBUF (readdata)</text><rect class="lg dp" x="0" y="752" width="26" height="16" rx="2"/><text x="36" y="766" class="cap" font-size="19">datapath</text><rec