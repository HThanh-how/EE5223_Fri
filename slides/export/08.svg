<svg data-slide="08" class="dsvg" viewBox="0 0 1700 780" xmlns="http://www.w3.org/2000/svg" role="img"><defs><marker id="wrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="mk d"/></marker><marker id="wrds" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk d"/></marker><marker id="wrc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="mk c"/></marker><marker id="wrcs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk c"/></marker></defs><g class="bx ext" data-id="b51" data-n="Bus Avalon-MM" data-i="Slave Avalon-MM 32 bit, địa chỉ theo word (14 bit = 64 KiB), readLatency 1, không bao giờ waitrequest."><rect x="0" y="160" width="230" height="330" rx="3"/><text x="115" y="259.5" text-anchor="middle" class="t1" font-size="24.0">Bus Avalon-MM</text><text x="115" y="288.5" text-anchor="middle" class="t2" font-size="19.0">avs_address[13:0]</text><text x="115" y="317.5" text-anchor="middle" class="t2" font-size="17.7">avs_read / avs_write</text><text x="115" y="346.5" text-anchor="middle" class="t2" font-size="19.0">avs_writedata</text><text x="115" y="375.5" text-anchor="middle" class="t2" font-size="19.0">avs_readdata</text><text x="115" y="404.5" text-anchor="middle" class="t2" font-size="19.0">waitrequest = 0</text></g><g class="aw" data-f="b51" data-t="b52"><path class="ar d" d="M230 325 L290 325" marker-end="url(#wrd)" marker-start="url(#wrds)"/></g><g class="bx ctl" data-id="b52" data-n="Giải mã" data-i="avs_address[13:12]: 0 = thanh ghi và QBUF, 1 = WEIGHT, 2 = ABUF, 3 = CBUF."><rect x="290" y="20" width="130" height="620" rx="3"/><text x="355" y="264.5" text-anchor="middle" class="t1" font-size="24.0">Giải mã</text><text x="355" y="293.5" text-anchor="middle" class="t2" font-size="19.0">địa chỉ</text><text x="355" y="351.5" text-anchor="middle" class="t2" font-size="17.0">avs_address</text><text x="355" y="380.5" text-anchor="middle" class="t2" font-size="19.0">[13:12]</text><text x="355" y="409.5" text-anchor="middle" class="t2" font-size="19.0">chọn vùng</text></g><g class="bx ctl" data-id="b53" data-n="0x0000  Thanh ghi" data-i="CTRL (W): bit0 start, bit1 xóa done/err, bit2 ACCUM, bit3 QUANT. STATUS (R): busy, done, err. M, CYCLES, INFO, QMULT, QSHIFT, ACT, BIAS[j] ở 0x0040+4j."><rect x="480" y="20" width="400" height="100" rx="3"/><text x="680" y="48.0" text-anchor="middle" class="t1" font-size="24.0">0x0000  Thanh ghi</text><text x="680" y="77.0" text-anchor="middle" class="t2" font-size="19.0">CTRL · STATUS · M · CYCLES</text><text x="680" y="106.0" text-anchor="middle" class="t2" font-size="18.7">INFO · QMULT · QSHIFT · ACT · BIAS</text></g><g class="aw" data-f="b52" data-t="b53"><path class="ar d" d="M420 70 L480 70" marker-end="url(#wrd)"/></g><g class="bx mem" data-id="b54" data-n="0x4000  WEIGHT  (W)" data-i="Weight INT8 ghi theo word 32 bit (4 byte = 4 cột); chỉ nhận khi NPU không bận."><rect x="480" y="150" width="400" height="100" rx="3"/><text x="680" y="192.5" text-anchor="middle" class="t1" font-size="24.0">0x4000  WEIGHT  (W)</text><text x="680" y="221.5" text-anchor="middle" class="t2" font-size="19.0">word i·(N/4)+q = W[i][4q..4q+3]</text></g><g class="aw" data-f="b52" data-t="b54"><path class="ar d" d="M420 200 L480 200" marker-end="url(#wrd)"/></g><g class="bx mem" data-id="b55" data-n="0x8000  ABUF  (W)" data-i="Activation INT8: một hàng của A cho mỗi m; sâu tối đa DEPTH hàng; chỉ ghi khi !busy."><rect x="480" y="280" width="400" height="100" rx="3"/><text x="680" y="322.5" text-anchor="middle" class="t1" font-size="24.0">0x8000  ABUF  (W)</text><text x="680" y="351.5" text-anchor="middle" class="t2" font-size="19.0">hàng m của A, INT8</text></g><g class="aw" data-f="b52" data-t="b55"><path class="ar d" d="M420 330 L480 330" marker-end="url(#wrd)"/></g><g class="bx mem" data-id="b56" data-n="0xC000  CBUF  (R)" data-i="Tổng INT32 chưa lượng tử hóa; CPU đọc để cộng dồn hoặc kiểm tra."><rect x="480" y="410" width="400" height="100" rx="3"/><text x="680" y="452.5" text-anchor="middle" class="t1" font-size="24.0">0xC000  CBUF  (R)</text><text x="680" y="481.5" text-anchor="middle" class="t2" font-size="19.0">INT32 C[m][j] tại 4·(m·N+j)</text></g><g class="aw" data-f="b56" data-t="b52"><path class="ar r" d="M480 460 L420 460" marker-end="url(#wrd)"/></g><g class="bx mem" data-id="b57" data-n="0x1000  QBUF  (R)" data-i="Kết quả INT8 sau bias, requant và hàm kích hoạt."><rect x="480" y="540" width="400" height="100" rx="3"/><text x="680" y="582.5" text-anchor="middle" class="t1" font-size="24.0">0x1000  QBUF  (R)</text><text x="680" y="611.5" text-anchor="middle" class="t2" font-size="19.0">INT8 sau requant + ACT</text></g><g class="aw" data-f="b57" data-t="b52"><path class="ar r" d="M480 590 L420 590" marker-end="url(#wrd)"/></g><g class="bx ctl" data-id="b58" data-n="Sequencer" data-i="Máy trạng thái: đọc ABUF[sent] mỗi chu kỳ, nhận kết quả theo out_valid, cộng dồn vào CBUF, rồi chạy hậu xử lý nếu QUANT."><rect x="1010" y="20" width="310" height="100" rx="3"/><text x="1165" y="62.5" text-anchor="middle" class="t1" font-size="24.0">Sequencer</text><text x="1165" y="91.5" text-anchor="middle" class="t2" font-size="15.7">sent / recv · busy · done · err</text></g><g class="aw" data-f="b53" data-t="b58"><path class="ar c" d="M880 70 L1010 70" marker-end="url(#wrc)"/></g><g class="bx dp" data-id="b59" data-n="sa_top" data-i="Lõi tính toán: nhận weight từ WEIGHT và activation từ ABUF, trả c_out."><rect x="1010" y="190" width="310" height="200" rx="3"/><text x="1165" y="253.5" text-anchor="middle" class="t1" font-size="24.0">sa_top</text><text x="1165" y="282.5" text-anchor="middle" class="t2" font-size="19.0">Systolic Array N×N</text><text x="1165" y="311.5" text-anchor="middle" class="t2" font-size="19.0">skew · de-skew</text><text x="1165" y="340.5" text-anchor="middle" class="t2" font-size="19.0">trễ 2N − 1 chu kỳ</text></g><g class="aw" data-f="b54" data-t="b59"><path class="ar d" d="M880 200 L1010 230" marker-end="url(#wrd)"/></g><g class="aw" data-f="b55" data-t="b59"><path class="ar d" d="M880 330 L1010 330" marker-end="url(#wrd)"/></g><text x="940" y="322" class="cap" font-size="17" text-anchor="middle">a_in</text><g class="aw" data-f="b58" data-t="b59"><path class="ar c" d="M1165 120 L1165 190" marker-end="url(#wrc)"/></g><g class="bx dp" data-id="b60" data-n="Cộng dồn + hậu xử lý" data-i="sum_row ghi vào CBUF; khi QUANT = 1, tiếp tục bias, nhân, dịch, bão hòa rồi ACT để ghi vào QBUF."><rect x="1010" y="450" width="310" height="190" rx="3"/><text x="1165" y="508.5" text-anchor="middle" class="t1" font-size="24.0">Cộng dồn + hậu xử lý</text><text x="1165" y="537.5" text-anchor="middle" class="t2" font-size="19.0">sum_row = CBUF cũ + c_out</text><text x="1165" y="566.5" text-anchor="middle" class="t2" font-size="19.0">(sum + bias) × QMULT</text><text x="1165" y="595.5" text-anchor="middle" class="t2" font-size="19.0">>>> QSHIFT · clamp · ACT</text></g><g class="aw" data-f="b59" data-t="b60"><path class="ar d" d="M1165 390 L1165 450" marker-end="url(#wrd)"/></g><g class="aw" data-f="b60" data-t="b56"><path class="ar d" d="M1010 470 L880 470" marker-end="url(#wrd)"/></g><g class="aw" data-f="b60" data-t="b57"><path class="ar d" d="M1010 600 L880 600" marker-end="url(#wrd)"/></g><text x="1370" y="60" class="cap" font-size="19" text-anchor="start">CTRL: start · clear</text><text x="1370" y="90" class="cap" font-size="19" text-anchor="start">ACCUM: cộng vào CBUF</text><text x="1370" y="120" class="cap" font-size="19" text-anchor="start">QUANT: bias + requant</text><text x="1370" y="220" class="cap" font-size="19" text-anchor="start">Đọc: readdatavalid</text><text x="1370" y="250" class="cap" font-size="19" text-anchor="start">trễ 1 chu kỳ sau avs_read</text><text x="1370" y="320" class="cap" font-size="19" text-anchor="start">Ghi WEIGHT, ABUF chỉ</text><text x="1370" y="350" class="cap" font-size="19" text-anchor="start">khi !busy</text><text x="1370" y="420" class="cap" font-size="19" text-anchor="start">Cửa sổ 64 KiB,</text><text x="1370" y="450" class="cap" font-size="19" text-anchor="start">địa chỉ theo word (14 bit)</text><rect class="lg dp" x="0" y="752" width="26" height="16" rx="2"/><text x="36" y="766" class="cap" font-size="19">datapath</text><rect class="lg ctl" x="168.8" y="752" width="26" height="16" rx="2"/><text x="204.8" y="766" class="cap" font-size="19">điều khiển</text><rect class="lg mem" x="360.8" y="752" width="26" height="16" rx="2"/><text x="396.8" y="766" class="cap" font-size="19">bộ nhớ</text><rect class="lg ext" x="506.4" y="752" width="26" height="16" rx="2"/><text x="542.4" y="766" class="cap" font-size="19">ngoài khối</text></svg>