name: CI (RTL + firmware regression)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build toolchain image (Debian trixie, verilator, riscv gcc, python)
        run: docker build -t npu-ci .

      - name: Preflight (array unit tests, SoC selftests, LeNet-5, LSTM vs golden)
        run: docker run --rm -v "$PWD/preflight_logs:/opt/npu/preflight_logs" npu-ci bash scripts/preflight.sh --quick

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preflight-logs
          path: preflight_logs/
