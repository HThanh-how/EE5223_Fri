name: Package (container image on GHCR)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name and tag
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || TAG=dev
          echo "IMG=${IMG}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Build
        run: docker build -t "${IMG}:${TAG}" -t "${IMG}:latest" .

      - name: Smoke test (quick preflight inside the image)
        run: docker run --rm "${IMG}:${TAG}"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        run: |
          docker push "${IMG}:${TAG}"
          docker push "${IMG}:latest"
