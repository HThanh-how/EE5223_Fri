name: Build LaTeX PDF

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    env:
      REPORT_DIR: .
      REPORT_PATH: report.tex
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check report path
        run: |
          set -e
          if [ ! -f "${REPORT_PATH}" ]; then
            echo "Không tìm thấy ${REPORT_PATH} ở gốc kho"
            exit 1
          fi

      - name: Diagnose workflow start
        run: |
          echo "Workflow triggered on $GITHUB_REF at commit $GITHUB_SHA"
          echo "REPORT_DIR=${REPORT_DIR}"
          echo "REPORT_PATH=${REPORT_PATH}"

      - name: Show environment
        run: |
          uname -a
          which xelatex || true
          which latexmk || true
          which biber || true
          tlmgr --version || true

      - name: Compile LaTeX (XeLaTeX)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ${{ env.REPORT_PATH }}
          latexmk_use_xelatex: true
          latexmk_use_biber: true
          latexmk_shell_escape: true
          extra_system_packages: biber
          pre_compile: |
            tlmgr update --self
            tlmgr install \
              biblatex biber biblatex-ieee csquotes siunitx \
              circuitikz lm pgfplots babel-english babel-vietnamese \
              vntex enumitem multirow || true

      - name: Rename PDF with prefix EE5223_Report_DD_MM_YY
        run: |
          set -e
          DATE_PREFIX=$(date +'%d_%m_%y')
          PREFIX="EE5223_Report_${DATE_PREFIX}"
          SRC_PDF="${REPORT_DIR}/report.pdf"
          DEST_PDF="${REPORT_DIR}/${PREFIX}.pdf"
          if [ ! -f "${SRC_PDF}" ]; then
            echo "Không tìm thấy PDF sau compile: ${SRC_PDF}"
            ls -la "${REPORT_DIR}"
            exit 1
          fi
          mv "${SRC_PDF}" "${DEST_PDF}"
          echo "RENAMED_PDF=${DEST_PDF}" >> $GITHUB_ENV

      - name: List workspace files
        if: always()
        run: |
          ls -la
          echo "Renamed exists?"; [ -f "${RENAMED_PDF}" ] && echo yes || echo no

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ee5223-report-pdf
          path: ${{ env.RENAMED_PDF }}

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ee5223-report-logs
          path: |
            report.log
            report.blg
            report.bcf*
            report.bbl*
            report.fls
            report.fdb_latexmk

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-pdf
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ee5223-report-pdf
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Automated Build ${{ github.run_number }}
          generate_release_notes: true
          files: dist/*.pdf
